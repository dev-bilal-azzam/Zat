name: Deploy Release (Android & iOS)

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version (optional, e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Determine Version & Create Tag ONCE
  # ---------------------------------------------------------------------------
  version-and-tag:
    name: Determine & Bump Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      version_code: ${{ steps.set_version.outputs.version_code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine & Bump Version
        id: set_version
        run: |
          git fetch --tags
          MANUAL_VERSION="${{ inputs.version }}"
          
          if [ -n "$MANUAL_VERSION" ]; then
            VERSION="$MANUAL_VERSION"
            IFS='.' read -r major minor patch <<< "$VERSION"
            VERSION_CODE=$((major*10000 + minor*100 + patch))
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
            IFS='.' read -r major minor patch <<< "$LAST_TAG"
            patch=$((patch + 1))
            VERSION="$major.$minor.$patch"
            VERSION_CODE=$((major*10000 + minor*100 + patch))
          fi

          echo "Selected Version: $VERSION"
          echo "Selected Version Code: $VERSION_CODE"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  # ---------------------------------------------------------------------------
  # Step 2: Build & Distribute Android (Runs on Ubuntu)
  # ---------------------------------------------------------------------------
  deploy-android:
    name: Build & Distribute Android
    needs: version-and-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > composeApp/src/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > composeApp/keystore.jks

      - name: Build Android Release APK
        run: |
          ./gradlew :composeApp:assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/composeApp/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -PVERSION_CODE=${{ needs.version-and-tag.outputs.version_code }} \
            -PVERSION_NAME=${{ needs.version-and-tag.outputs.version }}

      - name: Rename APK
        run: |
          VERSION="${{ needs.version-and-tag.outputs.version }}"
          mv composeApp/build/outputs/apk/release/composeApp-release.apk composeApp/build/outputs/apk/release/zat-${VERSION}.apk
          echo "APK_PATH=composeApp/build/outputs/apk/release/zat-${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload signed APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-and-tag.outputs.version }}
          name: Zat ${{ needs.version-and-tag.outputs.version }}
          body: |
            🚀 New Zat Release Uploaded!

            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **By:** ${{ github.actor }}
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Firebase Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: ${{ env.APK_PATH }}
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

  # ---------------------------------------------------------------------------
  # Step 3: Build & Distribute iOS (Runs in Parallel on macOS)
  # ---------------------------------------------------------------------------
  deploy-ios:
    name: Build & Distribute iOS
    needs: version-and-tag
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Xcode
        run: |
          ./gradlew clean
          xcodebuild clean build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build-ios \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_PREVIEWS=NO

      - name: Zip .app bundle
        run: |
          VERSION="${{ needs.version-and-tag.outputs.version }}"
          APP_PATH=$(find build-ios/Build/Products/Release-iphonesimulator -name "*.app" -type d -print -quit)
          [ -z "$APP_PATH" ] && { echo "Error: .app bundle not found!"; exit 1; }
          (cd "$(dirname "$APP_PATH")" && zip -r "$GITHUB_WORKSPACE/zat-ios-${VERSION}.zip" "$(basename "$APP_PATH")")
          echo "ZIP_PATH=zat-ios-${VERSION}.zip" >> $GITHUB_ENV

      - name: Upload zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-and-tag.outputs.version }}
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Appetize
        uses: appetizeio/github-action-appetize@v1.0.5
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ secrets.APPETIZE_PUBLIC_KEY }}
          appFile: ${{ env.ZIP_PATH }}
          platform: 'ios'