name: Deploy release to Firebase

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version (optional, e.g. 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & distribute Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > composeApp/src/google-services.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > composeApp/keystore.jks

      - name: Determine & bump version
        id: set_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION_FILE="composeApp/src/commonMain/resources/version.txt"
            mkdir -p $(dirname $VERSION_FILE)
            if [ ! -f "$VERSION_FILE" ]; then
              echo "1.0.0" > $VERSION_FILE
            fi
            CURRENT_VERSION=$(cat $VERSION_FILE)
            IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
            patch=$((patch + 1))
            VERSION="$major.$minor.$patch"
            echo "$VERSION" > $VERSION_FILE
          fi
          VERSION_CODE=$(echo $VERSION | awk -F'.' '{print $1*10000 + $2*100 + $3}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Check files
        run: ls -la composeApp

      - name: Build Android Release APK
        run: |
          ./gradlew :composeApp:assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/composeApp/keystore.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
          -PVERSION_CODE=${{ env.VERSION_CODE }} \
          -PVERSION_NAME=${{ env.VERSION }}

      - name: Rename APK
        run: |
          mv composeApp/build/outputs/apk/release/composeApp-release.apk composeApp/build/outputs/apk/release/zat-v${{ env.VERSION }}.apk
          echo "APK_PATH=composeApp/build/outputs/apk/release/zat-v${{ env.VERSION }}.apk" >> $GITHUB_ENV

      - name: Upload to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: ${{ env.APK_PATH }}
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

      - name: Upload signed APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Zat v${{ env.VERSION }}
          body: |
            🚀 New Zat Release Uploaded!
            
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **By:** ${{ github.actor }}
            **Title:** ${{ github.event.pull_request.title }}
            **PR Description:** ${{ github.event.pull_request.body }}
          files: composeApp/build/outputs/apk/release/zat-v${{ env.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}