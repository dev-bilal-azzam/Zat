name: Develop Release

on:
  push:
    branches:
      - develop

jobs:
  develop-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Get latest dev tag
        id: get-dev-tag
        run: |
          set -e
          LAST_TAG=$(git tag --list "dev-*" | sort -V | tail -n 1 || echo "dev-0.0.0")
          BASE_VERSION=${LAST_TAG#dev-}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          PATCH=$((PATCH+1))
          NEW_TAG="dev-$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          echo "version-name=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT
          git tag $NEW_TAG
          git push origin $NEW_TAG

      - name: Setup JDK & Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        run: |
          echo ${{ secrets.KEYSTORE_BASE64 }} | base64 --decode > keystore.jks

      - name: Decode google-services.json
        run: |
          echo ${{ secrets.GOOGLE_SERVICES_JSON }} | base64 --decode > shared/src/androidMain/google-services.json

      - name: Build Android Release APK
        run: |
          set -e
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -PVERSION_CODE=${{ steps.get-dev-tag.outputs.version-code }} \
            -PVERSION_NAME=${{ steps.get-dev-tag.outputs.version-name }}

      - name: Rename APK for develop
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/zat-${{ steps.get-dev-tag.outputs.version-name }}.apk
          echo "APK_PATH=app/build/outputs/apk/release/zat-${{ steps.get-dev-tag.outputs.version-name }}.apk" >> $GITHUB_ENV

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get-dev-tag.outputs.version-name }}
          files: ${{ env.APK_PATH }}
          body: "Develop release version ${{ steps.get-dev-tag.outputs.version-name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal
          file: ${{ env.APK_PATH }}